name: Сборка

# Собирает дистрибутивы под все платформы и прикладывает их к релизу.
# Ручной запуск — по кнопке (workflow_dispatch), автоматический — на тег v*.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Тесты и смоук
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Юнит-тесты
        run: npm test

      - name: Смоук-тест в Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm run smoke

  build:
    name: Сборка (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Собрать (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist

      - name: Собрать (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Собрать (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: kanban-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
