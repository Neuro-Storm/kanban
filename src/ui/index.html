<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>Канбан</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect x="2.5" y="3" width="5.4" height="18" rx="1.6" fill="currentColor" opacity="0.35"/>
            <rect x="9.3" y="3" width="5.4" height="18" rx="1.6" fill="currentColor" opacity="0.65"/>
            <rect x="16.1" y="3" width="5.4" height="18" rx="1.6" fill="currentColor"/>
          </svg>
        </span>
        <h1 class="brand-title">Канбан</h1>
        <span class="brand-sub" id="saveStatus">доска в работе</span>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Найти стикер…" autocomplete="off" spellcheck="false" />
        <button id="searchClear" class="search-clear" type="button" title="Очистить">×</button>
      </div>

      <div class="actions">
        <select id="themeSelect" class="theme-select" title="Тема доски"></select>
        <button id="bulkDeleteBtn" class="btn btn-ghost-danger" type="button" hidden>Удалить</button>
      </div>
    </header>

    <main class="board-wrap">
      <div class="board" id="board" aria-label="Канбан-доска">
      <button id="addColumnBtn" class="add-column" type="button">＋ Колонка</button>
      </div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
    <div class="confirm-pop" id="confirmPop" hidden></div>
  </div>

  <template id="tpl-column">
    <section class="column" data-column-id="">
      <header class="column-head">
        <div class="column-title-row">
          <h2 class="column-title" data-role="title"></h2>
          <span class="column-count" data-role="count"></span>
        </div>
        <div class="column-tools">
          <button class="icon-btn" data-action="column-menu" title="Настройки колонки" type="button">⚙</button>
        </div>
      </header>
      <div class="sticker-list" data-role="list" title="Кликни по пустому месту и печатай — новый стикер"></div>
    </section>
  </template>

  <template id="tpl-sticker">
    <article class="sticker" data-task-id="" tabindex="0">
      <div class="sticker-pin" aria-hidden="true"></div>
      <div class="sticker-body">
        <div class="sticker-badges" data-role="badges"></div>
        <div class="sticker-text" data-role="text"></div>
        <div class="sticker-meta" data-role="meta"></div>
      </div>
      <div class="sticker-actions">
        <button class="chip-btn" data-action="edit" title="Редактировать всё (метка, цвет, срок)" type="button">✎</button>
        <button class="chip-btn chip-danger" data-action="delete" title="Удалить" type="button">✕</button>
      </div>
    </article>
  </template>

  <template id="tpl-editor">
    <div class="editor" role="dialog" aria-modal="true" aria-label="Стикер">
      <div class="editor-sheet">
        <div class="editor-grip" aria-hidden="true"></div>
        <label class="field">
          <span class="field-label">Текст стикера</span>
          <div id="editText" class="rich-editor" contenteditable="true" spellcheck="true"></div>
        </label>
        <div class="field-row">
          <div class="field">
            <span class="field-label">Метка</span>
            <div class="chip-select" id="editTags" data-role="tags"></div>
          </div>
          <div class="field">
            <span class="field-label">Крайний срок</span>
            <input id="editDue" name="dueDate" type="date" />
          </div>
        </div>
        <div class="field">
          <span class="field-label">Цвет стикера</span>
          <div class="color-select" id="editColors" data-role="colors"></div>
        </div>
        <label class="field field-inline">
          <input id="editPriority" type="checkbox" />
          <span class="field-label">Пометить срочным (⚑)</span>
        </label>
        <div class="editor-buttons">
          <button id="editDelete" class="btn btn-ghost-danger" type="button">Удалить</button>
          <div class="editor-buttons-right">
            <button id="editSave" class="btn btn-primary" type="button">Готово</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="../core/store.js"></script>
  <script src="app.js"></script>
</body>
</html>
